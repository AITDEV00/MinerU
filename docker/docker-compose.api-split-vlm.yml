# MinerU API with parse_method=vlm (Split Layout + Extraction)
# Build: make build-split-vlm
# Run:   make run-split-vlm
# Stop:  make run-split-vlm-down

services:
  mineru-api:
    env_file:
      - ../../k8-cluster-infra/secrets.d/icarus-mineru.env
    build:
      context: ..
      dockerfile: docker/Dockerfile.api-split-vlm
    image: adeo-mineru-api:split-vlm
    container_name: mineru-api-split-vlm
    ports:
      - "8085:8000"
    environment:
      - MINERU_VL_SERVER=${MINERU_VL_SERVER:-https://inference.adeoaiengine.ecouncil.ae/models/0f8674c2-5fb8-43c7-bf2d-a6e5db2c0ff4/proxy/}
      - MINERU_VL_SERVER_EXTRACTION=${MINERU_VL_SERVER_EXTRACTION:-https://inference.adeoaiengine.ecouncil.ae/models/91c6dca7-b1c4-4e0b-8fec-11e8b82448f2/proxy/}
      - MINERU_VL_MODEL_NAME_EXTRACTION=${MINERU_VL_MODEL_NAME_EXTRACTION:-Qwen/Qwen3-VL-30B-A3B-Instruct}
      - MINERU_DEFAULT_BACKEND=hybrid-http-client
      - MINERU_MODEL_SOURCE=local
      - MINERU_SSL_VERIFY=false
      - MINERU_PDF_RENDER_THREADS=8
      - MINERU_HYBRID_BATCH_RATIO=8
    volumes:
      - mineru-hf-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  mineru-hf-cache:
